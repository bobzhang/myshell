name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # Windows is here for the path code specifically. Every process test is
      # skipped there, but the path parser and the matcher are not, and they
      # are the parts that cannot be checked from a Unix machine.
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check --deny-warn

      # Sequential on purpose. These tests spawn real processes, and running
      # them in parallel put enough pressure on a runner to fail a spawn or a
      # read with EAGAIN — which is a property of the runner, not of the code
      # under test, and made the suite flaky on Linux.
      #
      # Not on Windows: `#cfg(platform="windows")` describes the target, and a
      # wasm target is never "windows", so the guards that skip the process
      # tests do not apply there and all 84 ran against a host with no
      # `/bin/sh` and no `/tmp`. The native job below is where Windows is
      # actually exercised, and there the guards mean what they say.
      - name: Test (wasm)
        if: runner.os != 'Windows'
        run: moon test --target wasm --no-parallelize

      - name: Test (native)
        run: moon test --target native --no-parallelize

      - name: Interface is up to date
        if: runner.os != 'Windows'
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti

      - name: Formatted
        if: runner.os != 'Windows'
        run: |
          moon fmt
          git diff --exit-code
